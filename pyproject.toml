[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controle-financeiro"
version = "2.0.0"
description = "Controle de gastos dos cartões, empréstimos e caixinhas (site e servidor para o Claude)."
readme = "README.md"
requires-python = ">=3.12"
# Base: só o que a versão web (Vercel) precisa. Para desenvolver e rodar a Ayla (servidor MCP):
#   python -m pip install -e ".[claude,dev]"
dependencies = [
    "cryptography>=42",
    "requests>=2.31",
    "fastapi>=0.110",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
claude = ["mcp>=1.2,<2"]
dev = ["pytest>=8", "pyflakes>=3", "httpx>=0.27", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
