# Roda os testes e o pyflakes (e o build do site) a cada envio para o GitHub e em cada pull request.
# Os testes usam SQLite temporário (tests/conftest.py): nunca tocam no Supabase.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.sistema }})
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        sistema: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen  # a interface é montada sem abrir janela
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bibliotecas de sistema do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Instalar o app e as ferramentas de teste
        run: python -m pip install -e ".[desktop,claude,dev]"
      - name: Lint (pyflakes)
        run: python -m pyflakes src tests
      - name: Testes
        run: python -m pytest -q

  site:
    name: Site (build do web/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar e montar o site (TypeScript + Vite)
        working-directory: web
        run: npm ci && npm run build
